<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Suspension Lab — audición de SFX</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 system-ui, sans-serif; background: #14171c; color: #e6e9ee; margin: 0; padding: 28px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #98a2b0; margin: 0 0 24px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #8fa3b8; margin: 28px 0 10px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; }
  .row:hover { background: #1d232b; }
  .name { width: 220px; font-family: ui-monospace, monospace; font-size: 12px; }
  .desc { flex: 1; color: #98a2b0; font-size: 12px; }
  button { background: #2b6cb0; color: #fff; border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
  button.loop { background: #2f855a; }
  button:active { transform: translateY(1px); }
  input[type=range] { width: 110px; }
  label { font-size: 11px; color: #98a2b0; }
</style>
</head>
<body>
  <h1>Audición de SFX — Suspension Lab</h1>
  <p class="sub">Grabaciones reales (<code>scripts/fetch-sfx.mjs</code>) + <code>ui_*</code>, <code>countdown_*</code> y <code>engine_ev_loop</code> procedurales. En los bucles, el control "rate" simula el pitch que aplica el juego. <button id="stop-all">■ detener todo</button></p>
  <div id="app"></div>
  <script src="../public/sfx/manifest.js"></script>
  <script src="../sfx-candidates/candidates.js"></script>
  <script>
    const GROUPS = [
      ['motor', 'Motor (bucles escalables por rpm)'],
      ['rodadura', 'Rodadura por superficie (volumen con velocidad)'],
      ['neumático', 'Neumáticos (derrape con slip · frenada con pedal)'],
      ['suspensión', 'Suspensión y chasis'],
      ['chasis', 'Raspado de bajos'],
      ['impacto', 'Impactos (light &lt; heavy &lt; extreme)'],
      ['ambiente', 'Ambiente'],
      ['ui', 'UI y carrera'],
    ];
    const app = document.getElementById('app');
    const players = [];
    document.getElementById('stop-all').addEventListener('click', () => {
      for (const a of players) a.pause();
      for (const b of app.querySelectorAll('button')) if (b.id !== 'stop-all') b.textContent = '▶ play';
    });
    // --- Cata de candidatos (no están en el juego) ---
    // Compara con `tire_squeal_loop` de la lista de abajo (es el actual).
    const cands = window.SFX_CANDIDATES ?? [];
    if (cands.length) {
      const h = document.createElement('h2');
      h.textContent = '★ Cata: candidatos a derrape (fuera del juego)';
      app.appendChild(h);
      for (const m of cands) {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
          <button class="loop">▶ play</button>
          <span class="name">${m.name}<br><small style="color:#5c6773">${m.credit} · ${m.license} · <a href="${m.page}" target="_blank" rel="noopener">fuente</a></small></span>
          <label>rate <input type="range" min="0.4" max="2" step="0.01" value="1"></label>
          <span class="desc">${m.desc} — normalizados al mismo pico para comparar justo.</span>`;
        const audio = new Audio(`../sfx-candidates/${m.name}`);
        audio.loop = true;
        audio.volume = 0.8;
        players.push(audio);
        const btn = row.querySelector('button');
        const rate = row.querySelector('input');
        rate.addEventListener('input', () => { audio.playbackRate = parseFloat(rate.value); });
        btn.addEventListener('click', () => {
          if (!audio.paused) { audio.pause(); btn.textContent = '▶ play'; return; }
          audio.play();
          btn.textContent = '■ stop';
        });
        app.appendChild(row);
      }
    }
    const manifest = window.SFX_MANIFEST;
    for (const [group, title] of GROUPS) {
      const items = manifest.filter(m => m.group === group);
      if (!items.length) continue;
      const h = document.createElement('h2');
      h.textContent = title;
      app.appendChild(h);
      for (const m of items) {
        const row = document.createElement('div');
        row.className = 'row';
        const isLoop = m.kind === 'loop';
        row.innerHTML = `
          <button class="${isLoop ? 'loop' : ''}">▶ play</button>
          <span class="name">${m.name}<br><small style="color:#5c6773">${m.credit ?? 'procedural'} · ${m.license ?? '—'}</small></span>
          ${isLoop ? `<label>rate <input type="range" min="0.4" max="3" step="0.01" value="1"></label>` : ''}
          <span class="desc">${m.desc}</span>`;
        const audio = new Audio(`../public/sfx/${m.name}`);
        players.push(audio);
        audio.loop = isLoop;
        audio.volume = Math.min(1, (m.gain ?? 0.7) * 1.1);
        const btn = row.querySelector('button');
        const rate = row.querySelector('input');
        if (rate) rate.addEventListener('input', () => { audio.playbackRate = parseFloat(rate.value); });
        btn.addEventListener('click', () => {
          if (isLoop && !audio.paused) { audio.pause(); btn.textContent = '▶ play'; return; }
          if (!isLoop) audio.currentTime = 0;
          audio.play();
          btn.textContent = isLoop ? '■ stop' : '▶ play';
          if (!isLoop) audio.onended = () => { btn.textContent = '▶ play'; };
        });
        app.appendChild(row);
      }
    }
  </script>
</body>
</html>
